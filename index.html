<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Космічний Банер</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: #00e5ff;
    --accent2: #ff4081;
    --accent3: #ffd740;
    --dark: #030712;
    --text: #e0f7fa;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Exo 2', sans-serif;
    gap: 30px;
    padding: 20px;
  }

  /* ─── BANNER WRAPPER ─── */
  .banner-wrap {
    width: 100%;
    max-width: 1280px;
  }

  .banner {
    position: relative;
    width: 100%;
    overflow: hidden;
    border-radius: 16px;
    border: 1px solid rgba(0,229,255,.25);
    box-shadow: 0 0 60px rgba(0,229,255,.15), 0 0 120px rgba(0,0,0,.8);

    /* Static JPG background (inline base64 placeholder — замените src на свій .jpg) */
    background-image:
      radial-gradient(ellipse at 20% 50%, rgba(0,50,100,.6) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 20%, rgba(60,0,80,.5) 0%, transparent 50%),
      url('https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=1400&q=80&fm=jpg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
  }

  /* ── aspect-ratio адаптація (3 breakpoints ширини × 3 висоти) ── */
  /* Mobile portrait  ≤ 480px  → висота 280px */
  .banner { height: 280px; }

  /* Tablet 481–900px → висота 380px */
  @media (min-width: 481px) { .banner { height: 380px; } }

  /* Desktop > 900px  → висота 520px */
  @media (min-width: 901px) { .banner { height: 520px; } }

  /* Дуже широкий > 1280px → висота 600px */
  @media (min-width: 1281px) { .banner { height: 600px; } }

  /* ─── STARS LAYER ─── */
  .stars {
    position: absolute; inset: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .star {
    position: absolute;
    width: 2px; height: 2px;
    background: #fff;
    border-radius: 50%;
    animation: twinkle var(--d, 3s) ease-in-out infinite alternate;
    opacity: var(--o, .7);
  }
  @keyframes twinkle {
    from { opacity: .1; transform: scale(.8); }
    to   { opacity: 1;  transform: scale(1.4); }
  }

  /* ─── PNG IMAGES with CSS animations ─── */

  /* 1. Планета */
  .planet {
    position: absolute;
    width: clamp(100px, 18vw, 220px);
    aspect-ratio: 1;
    bottom: -20px; right: 5%;
    background: radial-gradient(circle at 35% 35%,
      #7b5ea7 0%, #3a1a6e 50%, #0d0520 100%);
    border-radius: 50%;
    box-shadow:
      inset -20px -20px 40px rgba(0,0,0,.6),
      0 0 40px rgba(123,94,167,.4),
      0 0 80px rgba(123,94,167,.2);
    animation: planetFloat 6s ease-in-out infinite, planetGlow 4s ease-in-out infinite alternate;
  }
  /* Кільця планети */
  .planet::after {
    content: '';
    position: absolute;
    width: 160%; height: 30%;
    border: 3px solid rgba(180,140,255,.4);
    border-radius: 50%;
    top: 35%; left: -30%;
    transform: rotateX(70deg);
    box-shadow: 0 0 10px rgba(180,140,255,.3);
    animation: ringPulse 4s ease-in-out infinite alternate;
  }
  @keyframes planetFloat {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50%       { transform: translateY(-18px) rotate(3deg); }
  }
  @keyframes planetGlow {
    from { box-shadow: inset -20px -20px 40px rgba(0,0,0,.6), 0 0 40px rgba(123,94,167,.3); }
    to   { box-shadow: inset -20px -20px 40px rgba(0,0,0,.6), 0 0 70px rgba(180,100,255,.6); }
  }
  @keyframes ringPulse {
    from { opacity: .5; }
    to   { opacity: 1; }
  }

  /* 2. Ракета */
  .rocket {
    position: absolute;
    top: 8%; left: 8%;
    font-size: clamp(36px, 7vw, 80px);
    animation: rocketFly 8s ease-in-out infinite;
    filter: drop-shadow(0 0 12px rgba(255,200,50,.8));
    z-index: 2;
  }
  @keyframes rocketFly {
    0%   { transform: translate(0, 0)    rotate(-10deg); }
    25%  { transform: translate(15px, -20px) rotate(-5deg); }
    50%  { transform: translate(25px, 5px)  rotate(-15deg); }
    75%  { transform: translate(10px, -10px) rotate(-8deg); }
    100% { transform: translate(0, 0)    rotate(-10deg); }
  }

  /* 3. Місяць */
  .moon {
    position: absolute;
    top: 10%; right: 28%;
    width: clamp(50px, 8vw, 100px);
    aspect-ratio: 1;
    background: radial-gradient(circle at 40% 40%, #e8e8c0, #aaa070 60%, #706040);
    border-radius: 50%;
    box-shadow: inset -8px -8px 20px rgba(0,0,0,.4), 0 0 20px rgba(220,200,100,.3);
    animation: moonOrbit 12s linear infinite;
    z-index: 1;
  }
  @keyframes moonOrbit {
    0%   { transform: translate(0,0)      scale(1); }
    25%  { transform: translate(-15px, 8px) scale(1.05); }
    50%  { transform: translate(-5px, 15px) scale(1); }
    75%  { transform: translate(10px, 5px)  scale(.95); }
    100% { transform: translate(0,0)      scale(1); }
  }

  /* 4. Метеор */
  .meteor {
    position: absolute;
    top: 18%; left: 35%;
    width: clamp(40px, 6vw, 70px);
    height: 3px;
    background: linear-gradient(90deg, transparent, #fff, var(--accent3));
    border-radius: 3px;
    animation: meteorShoot 5s linear infinite;
    opacity: 0;
    z-index: 3;
    filter: drop-shadow(0 0 4px var(--accent3));
  }
  @keyframes meteorShoot {
    0%   { opacity: 0; transform: translate(0,0) rotate(-30deg); }
    5%   { opacity: 1; }
    40%  { opacity: .8; transform: translate(200px, 120px) rotate(-30deg); }
    50%  { opacity: 0; transform: translate(250px, 150px) rotate(-30deg); }
    100% { opacity: 0; transform: translate(250px, 150px) rotate(-30deg); }
  }

  /* ─── CONTENT ─── */
  .content {
    position: absolute; inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(8px, 2vw, 18px);
    padding: clamp(12px, 4%, 40px);
    text-align: center;
    z-index: 10;
  }

  /* TEXT 1 — головний заголовок */
  .title {
    font-family: 'Orbitron', monospace;
    font-weight: 900;
    font-size: clamp(1.5rem, 5vw, 4rem);
    color: #fff;
    letter-spacing: .1em;
    text-transform: uppercase;
    line-height: 1.1;
    text-shadow: 0 0 20px var(--accent), 0 0 60px rgba(0,229,255,.4);
    animation: titlePulse 3s ease-in-out infinite alternate, titleFadeIn 1.2s ease both;
  }
  @keyframes titlePulse {
    from { text-shadow: 0 0 20px var(--accent), 0 0 60px rgba(0,229,255,.3); }
    to   { text-shadow: 0 0 40px var(--accent), 0 0 100px rgba(0,229,255,.6), 0 0 140px rgba(0,229,255,.2); }
  }
  @keyframes titleFadeIn {
    from { opacity: 0; transform: translateY(-30px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* TEXT 2 — підзаголовок */
  .subtitle {
    font-family: 'Exo 2', sans-serif;
    font-weight: 300;
    font-size: clamp(.75rem, 2.2vw, 1.4rem);
    color: var(--accent);
    letter-spacing: .25em;
    text-transform: uppercase;
    animation: subtitleSlide 1.5s ease .4s both, subtitleGlow 4s ease-in-out 2s infinite alternate;
  }
  @keyframes subtitleSlide {
    from { opacity: 0; transform: translateX(-40px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  @keyframes subtitleGlow {
    from { color: var(--accent); }
    to   { color: #fff; text-shadow: 0 0 10px var(--accent); }
  }

  /* TEXT 3 — нижній слоган */
  .slogan {
    font-family: 'Orbitron', monospace;
    font-weight: 400;
    font-size: clamp(.6rem, 1.6vw, 1rem);
    color: var(--accent3);
    letter-spacing: .15em;
    text-transform: uppercase;
    border: 1px solid rgba(255,215,64,.4);
    padding: clamp(4px, 1vw, 10px) clamp(10px, 3vw, 28px);
    border-radius: 40px;
    background: rgba(255,215,64,.05);
    animation: sloganAppear 1.8s ease .8s both, sloganBlink 5s ease-in-out 2.5s infinite;
    backdrop-filter: blur(4px);
  }
  @keyframes sloganAppear {
    from { opacity: 0; transform: scale(.8); }
    to   { opacity: 1; transform: scale(1); }
  }
  @keyframes sloganBlink {
    0%, 100% { border-color: rgba(255,215,64,.4); box-shadow: none; }
    50%       { border-color: var(--accent3); box-shadow: 0 0 15px rgba(255,215,64,.4); }
  }

  /* ─── DIVIDER LINE ─── */
  .divider {
    width: clamp(60px, 15vw, 180px);
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    animation: dividerExpand 2s ease 1s both;
  }
  @keyframes dividerExpand {
    from { width: 0; opacity: 0; }
    to   { opacity: 1; }
  }

  /* ─── SCAN LINE overlay ─── */
  .scanline {
    position: absolute; inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,.04) 2px,
      rgba(0,0,0,.04) 4px
    );
    pointer-events: none;
    z-index: 20;
  }

  /* ─── CORNER decorations ─── */
  .corner {
    position: absolute;
    width: clamp(20px, 4vw, 40px);
    height: clamp(20px, 4vw, 40px);
    border-color: var(--accent);
    border-style: solid;
    opacity: .6;
    animation: cornerPulse 3s ease-in-out infinite alternate;
  }
  .corner-tl { top: 12px; left: 12px;  border-width: 2px 0 0 2px; }
  .corner-tr { top: 12px; right: 12px; border-width: 2px 2px 0 0; }
  .corner-bl { bottom: 12px; left: 12px;  border-width: 0 0 2px 2px; }
  .corner-br { bottom: 12px; right: 12px; border-width: 0 2px 2px 0; }
  @keyframes cornerPulse {
    from { opacity: .3; }
    to   { opacity: .9; }
  }

  /* ─── SIZE LABELS (демо breakpoints) ─── */
  .size-info {
    font-family: 'Exo 2', sans-serif;
    font-size: .7rem;
    color: rgba(255,255,255,.3);
    letter-spacing: .1em;
  }
  .size-info span { color: var(--accent); }
</style>
</head>
<body>

<div class="banner-wrap">
  <div class="banner" id="banner">

    <!-- Stars -->
    <div class="stars" id="stars"></div>

    <!-- PNG-елементи з CSS-анімацією -->
    <div class="planet"></div>       <!-- PNG 1: планета -->
    <div class="rocket">🚀</div>     <!-- PNG 2: ракета (emoji як заглушка) -->
    <div class="moon"></div>         <!-- PNG 3: місяць -->
    <div class="meteor"></div>       <!-- PNG 4: метеор -->

    <!-- Scanline -->
    <div class="scanline"></div>

    <!-- Кутові декорації -->
    <div class="corner corner-tl"></div>
    <div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div>
    <div class="corner corner-br"></div>

    <!-- Контент -->
    <div class="content">
      <!-- Анімований текст 1 -->
      <div class="title">Дослідження<br>Всесвіту</div>

      <div class="divider"></div>

      <!-- Анімований текст 2 -->
      <div class="subtitle">Космічна місія &nbsp;·&nbsp; 2025</div>

      <!-- Анімований текст 3 -->
      <div class="slogan">⚡ Межі не існує ⚡</div>
    </div>

  </div>

  <p class="size-info" style="margin-top:8px; text-align:center;">
    </span>
  </p>
</div>

<script>
  // Генерація зірок
  const container = document.getElementById('stars');
  for (let i = 0; i < 120; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    s.style.cssText = `
      left: ${Math.random()*100}%;
      top:  ${Math.random()*100}%;
      --d:  ${(Math.random()*3 + 1.5).toFixed(1)}s;
      --o:  ${(Math.random()*.6 + .3).toFixed(2)};
      width:  ${Math.random() < .2 ? 3 : 2}px;
      height: ${Math.random() < .2 ? 3 : 2}px;
      animation-delay: ${(Math.random()*4).toFixed(1)}s;
    `;
    container.appendChild(s);
  }
</script>
</body>
</html>
